<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYPHER Terminal - UI POC</title>
    <style>
        /* --- CYPHER Design Tokens --- */
        :root {
            /* Text - Grayscale only */
            --cypher-text-bright: #ffffff;
            --cypher-text: #aaaaaa;
            --cypher-text-dim: #888888;
            --cypher-text-muted: #666666;
            --cypher-text-faint: #444444;
            --cypher-text-ghost: #333333;

            /* Backgrounds - Dark shades */
            --cypher-bg-darkest: #000000;
            --cypher-bg-dark: #0a0a0a;
            --cypher-bg: #111111;
            --cypher-bg-light: #1a1a1a;

            /* Static theme mappings */
            --bg-color: var(--cypher-bg-darkest);
            --window-shadow-opacity: 0.6;
            --desktop-pattern-opacity: 0.15;
        }

        /* Default Theme (Cyan) */
        body {
            --cypher-primary: #00FFCC;
            --cypher-primary-dim: #00CCAA;
            --cypher-primary-glow: rgba(0, 255, 204, 0.5);
            --cypher-primary-subtle: rgba(0, 255, 204, 0.2);
            --cypher-primary-faint: rgba(0, 255, 204, 0.1);
            --text-color: #00FFCC;
            --border-color: #00FFCC;
            --dither-color: #00FFCC;
            --dock-bg: rgba(0, 20, 15, 0.8);
            --dock-border: rgba(0, 255, 204, 0.2);
        }

        /* Matrix Green Theme */
        body.theme-matrix {
            --cypher-primary: #00FF41;
            --cypher-primary-dim: #00CC33;
            --cypher-primary-glow: rgba(0, 255, 65, 0.5);
            --cypher-primary-subtle: rgba(0, 255, 65, 0.2);
            --cypher-primary-faint: rgba(0, 255, 65, 0.1);
            --text-color: #00FF41;
            --border-color: #00FF41;
            --dither-color: #00FF41;
            --dock-bg: rgba(0, 15, 5, 0.8);
            --dock-border: rgba(0, 255, 65, 0.2);
        }

        /* --- Global Reset & Base --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Courier New', Consolas, Monaco, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Desktop Patterns (CSS Reactive) --- */
        .desktop-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: var(--desktop-pattern-opacity);
            z-index: 0;
            background-color: transparent;
        }

        /* Pattern Definitions */
        body[data-pattern="dither"] .desktop-canvas {
            background-image: repeating-conic-gradient(var(--text-color) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
        }
        body[data-pattern="grid"] .desktop-canvas {
            background-image: radial-gradient(var(--text-color) 0.5px, transparent 0);
            background-size: 4px 4px;
        }
        body[data-pattern="scanlines"] .desktop-canvas {
            background-image: linear-gradient(0deg, var(--text-color) 0.5px, transparent 0.5px);
            background-size: 100% 2px;
        }
        body[data-pattern="matrix"] .desktop-canvas {
            background-image:
                linear-gradient(var(--text-color) 0.5px, transparent 0.5px),
                linear-gradient(90deg, var(--text-color) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }
        body[data-pattern="hex"] .desktop-canvas {
            background-image: radial-gradient(var(--text-color) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        /* --- Dither Utilities --- */
        .dither-shadow {
            position: absolute;
            top: 4px;
            left: 4px;
            right: -4px;
            bottom: -4px;
            pointer-events: none;
            background-image: repeating-conic-gradient(var(--dither-color) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: var(--window-shadow-opacity);
            z-index: -1;
        }

        /* Dither hover effect - use instead of solid backgrounds */
        .dither-hover {
            position: relative;
        }

        .dither-hover::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
        }

        .dither-hover:hover::before {
            opacity: 0.8;
        }

        .dither-hover:hover {
            color: var(--bg-color);
        }

        /* --- Header --- */
        header {
            position: absolute;
            top: -40px;
            left: 0;
            right: 0;
            height: 32px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            transition: top 0.7s ease-out;
            text-shadow: 0 0 10px var(--cypher-primary-glow);
        }

        header.ready { top: 0; }

        .menu-items { display: flex; gap: 16px; }
        .menu-items span {
            cursor: default;
            padding: 4px 12px;
            letter-spacing: 0.1em;
            position: relative;
        }

        .menu-items span::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .menu-items span:hover::before {
            opacity: 1;
        }

        .menu-items span:hover {
            color: var(--bg-color);
            text-shadow: none;
        }

        .system-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2em;
        }

        /* --- Desktop Icons --- */
        .desktop-area {
            position: relative;
            height: 100%;
            padding-top: 32px;
        }

        .icon-grid {
            position: absolute;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 0 24px;
        }
        .icon-grid.right { right: 0; }
        .icon-grid.left { left: 0; }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            cursor: default;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-visual {
            padding: 8px;
            border: 1px solid transparent;
            transition: all 0.15s;
            color: var(--cypher-primary);
        }
        .desktop-icon:hover .icon-visual {
            border-color: var(--cypher-primary-subtle);
            box-shadow: 0 0 15px var(--cypher-primary-glow);
        }
        .desktop-icon:active .icon-visual {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .icon-label-wrap { position: relative; margin-top: 4px; }
        .icon-label {
            position: relative;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            font-size: 9px;
            font-weight: bold;
            padding: 2px 8px;
            white-space: nowrap;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* --- Window System --- */
        .window {
            position: absolute;
            min-width: 280px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
        }

        .window-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px var(--cypher-primary-glow);
        }

        .title-bar {
            height: 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            cursor: default;
            background: linear-gradient(180deg, var(--cypher-bg-light) 0%, var(--cypher-bg-darkest) 100%);
        }

        .window-btn {
            width: 32px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.1s;
            cursor: pointer;
            position: relative;
        }

        .window-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .window-btn:hover::before {
            opacity: 1;
        }

        .window-btn:hover {
            color: var(--bg-color);
        }

        .close-box {
            width: 10px;
            height: 10px;
            border: 1px solid currentColor;
        }

        .fullscreen-box {
            width: 10px;
            height: 10px;
            border: 1px solid currentColor;
            position: relative;
        }

        .fullscreen-box::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            width: 6px;
            height: 6px;
            border: 1px solid currentColor;
            background: var(--cypher-bg-light);
        }

        .window-btn:hover .fullscreen-box::after {
            background: var(--cypher-primary);
        }

        /* Fullscreen window state */
        .window.fullscreen {
            position: fixed !important;
            top: 32px !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 32px - 80px) !important;
            z-index: 999 !important;
        }

        .window.fullscreen .dither-shadow {
            display: none;
        }

        .window.fullscreen .resize-handle {
            display: none;
        }

        .title-text {
            flex: 1;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-shadow: 0 0 10px var(--cypher-primary-glow);
        }

        .window-content {
            flex: 1;
            padding: 16px;
            overflow: auto;
            font-size: 14px;
            line-height: 1.5;
            color: var(--cypher-text);
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            border-right: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            margin: 2px;
            opacity: 0.5;
        }
        .resize-handle:hover { opacity: 1; }

        /* --- Setup App UI --- */
        .setup-section { margin-bottom: 20px; }
        .setup-title {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.1em;
            color: var(--cypher-primary);
        }
        .pattern-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        .pattern-preview {
            aspect-ratio: 1;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            background-color: var(--bg-color);
            transition: all 0.15s;
        }

        /* Pattern previews */
        .pattern-preview[data-pattern="dither"] {
            background-image: repeating-conic-gradient(var(--text-color) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
        }
        .pattern-preview[data-pattern="grid"] {
            background-image: radial-gradient(var(--text-color) 0.5px, transparent 0);
            background-size: 4px 4px;
        }
        .pattern-preview[data-pattern="scanlines"] {
            background-image: linear-gradient(0deg, var(--text-color) 0.5px, transparent 0.5px);
            background-size: 100% 2px;
        }
        .pattern-preview[data-pattern="matrix"] {
            background-image: linear-gradient(var(--text-color) 0.5px, transparent 0.5px), linear-gradient(90deg, var(--text-color) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }
        .pattern-preview[data-pattern="hex"] {
            background-image: radial-gradient(var(--text-color) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .pattern-preview:hover {
            box-shadow: 0 0 10px var(--cypher-primary-glow);
        }
        .pattern-preview.active {
            outline: 2px solid var(--text-color);
            outline-offset: 2px;
            box-shadow: 0 0 15px var(--cypher-primary-glow);
        }

        .pattern-label {
            position: absolute;
            bottom: 2px;
            left: 2px;
            font-size: 7px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1px 4px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- Terminal --- */
        .terminal-box {
            background: var(--cypher-primary-faint);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            height: 100%;
            padding: 12px;
            overflow-y: auto;
            border: 1px solid var(--cypher-primary-subtle);
        }

        .terminal-line { margin: 2px 0; }
        .terminal-line.system { color: var(--cypher-text-dim); }
        .terminal-line.output { color: var(--cypher-text); }
        .terminal-line.highlight { color: var(--cypher-primary); }
        .terminal-line.dim { color: var(--cypher-text-muted); }

        .terminal-input-line {
            display: flex;
            margin-top: 8px;
        }
        .terminal-prompt {
            color: var(--cypher-primary);
            margin-right: 8px;
        }
        .terminal-input {
            background: none;
            border: none;
            color: var(--cypher-primary);
            outline: none;
            font-family: inherit;
            font-size: inherit;
            flex: 1;
            caret-color: var(--cypher-primary);
        }

        /* --- Two-Pane File Browser --- */
        .browser-content {
            display: flex;
            height: 100%;
        }

        .pane-left {
            width: 220px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .pane-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pane-header {
            padding: 8px 12px;
            border-bottom: 1px solid var(--cypher-primary-subtle);
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--cypher-text-dim);
            background: var(--cypher-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-header .count {
            color: var(--cypher-primary);
        }

        .pane-body {
            flex: 1;
            overflow-y: auto;
        }

        /* File list */
        .file-list {
            padding: 4px 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.1s;
            border-left: 2px solid transparent;
            position: relative;
        }

        .file-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .file-item:hover::before {
            opacity: 0.15;
        }

        .file-item.selected {
            border-left-color: var(--cypher-primary);
        }

        .file-item.selected::before {
            opacity: 0.25;
        }

        .file-item-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cypher-primary);
            font-size: 14px;
            flex-shrink: 0;
            opacity: 0.7;
            position: relative;
        }

        .file-item:hover .file-item-icon,
        .file-item.selected .file-item-icon {
            opacity: 1;
        }

        .file-item-info {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .file-item-name {
            font-size: 12px;
            color: var(--cypher-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item.selected .file-item-name {
            color: var(--cypher-primary);
        }

        .file-item-meta {
            font-size: 9px;
            color: var(--cypher-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Preview pane */
        .preview-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--cypher-text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .preview-content {
            padding: 16px;
        }

        .preview-header {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--cypher-primary-subtle);
        }

        .preview-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--cypher-primary);
            margin-bottom: 4px;
            text-shadow: 0 0 10px var(--cypher-primary-glow);
        }

        .preview-meta {
            display: flex;
            gap: 16px;
            font-size: 10px;
            color: var(--cypher-text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .preview-classification {
            padding: 2px 8px;
            border: 1px solid var(--cypher-primary);
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: var(--cypher-primary);
        }

        .preview-classification.secret {
            background: var(--cypher-primary);
            color: var(--bg-color);
        }

        .preview-classification.confidential {
            background: var(--cypher-primary-subtle);
        }

        .preview-classification.unclassified {
            opacity: 0.5;
        }

        .preview-body {
            font-size: 13px;
            line-height: 1.7;
            color: var(--cypher-text);
        }

        .preview-body p {
            margin-bottom: 12px;
        }

        .preview-body .redacted {
            background: var(--cypher-text-ghost);
            color: var(--cypher-text-ghost);
            padding: 0 4px;
            border-radius: 2px;
            user-select: none;
        }

        .preview-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--cypher-primary-subtle);
        }

        .preview-tag {
            padding: 4px 10px;
            border: 1px solid var(--cypher-primary-subtle);
            font-size: 10px;
            color: var(--cypher-text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .preview-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .preview-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--cypher-primary);
            color: var(--cypher-primary);
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color 0.1s, box-shadow 0.15s;
        }

        .preview-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .preview-btn:hover::before {
            opacity: 1;
        }

        .preview-btn:hover {
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--cypher-primary-glow);
        }

        .preview-btn.primary::before {
            opacity: 1;
        }

        .preview-btn.primary {
            color: var(--bg-color);
        }

        /* --- Dock --- */
        footer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -100px;
            z-index: 1000;
            transition: bottom 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition-delay: 0.3s;
        }
        footer.ready { bottom: 24px; }

        .dock {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--dock-border);
            background: var(--dock-bg);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px var(--cypher-primary-faint);
            gap: 8px;
        }

        .dock-btn {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid var(--dock-border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            color: var(--cypher-primary);
            transition: transform 0.15s, box-shadow 0.15s;
            overflow: hidden;
        }

        .dock-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .dock-btn:hover::before {
            opacity: 0.3;
        }

        .dock-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 15px var(--cypher-primary-glow);
            border-color: var(--cypher-primary-subtle);
        }

        .find-btn {
            padding: 0 20px;
            height: 44px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--cypher-primary);
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
            transition: color 0.1s, box-shadow 0.15s;
        }

        .find-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .find-btn:hover::before {
            opacity: 1;
        }

        .find-btn:hover {
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--cypher-primary-glow);
        }

        .dock-separator {
            width: 1px;
            height: 32px;
            background: var(--dock-border);
            margin: 0 8px;
        }

        .indicator {
            position: absolute;
            bottom: -8px;
            width: 4px;
            height: 4px;
            background: var(--cypher-primary);
            border-radius: 50%;
            display: none;
            box-shadow: 0 0 8px var(--cypher-primary);
        }
        .is-running .indicator { display: block; }

        /* --- Status Bar Info --- */
        .status-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 11px;
            letter-spacing: 0.05em;
        }
        .status-info .separator {
            width: 1px;
            height: 16px;
            background: var(--dock-border);
        }
        #clock {
            font-family: 'Courier New', monospace;
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--cypher-primary-subtle);
            padding: 4px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            opacity: 0.7;
        }
        .theme-toggle:hover {
            opacity: 1;
            background: var(--cypher-primary-faint);
        }
        .theme-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cypher-primary);
            box-shadow: 0 0 8px var(--cypher-primary-glow);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .fullscreen-toggle {
            background: none;
            border: 1px solid var(--cypher-primary-subtle);
            color: var(--cypher-primary);
            padding: 4px 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            opacity: 0.7;
        }
        .fullscreen-toggle:hover {
            opacity: 1;
            background: var(--cypher-primary-faint);
        }

        /* --- CRT Scanline overlay (optional) --- */
        .crt-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        /* --- Custom Scrollbar --- */
        .pane-body::-webkit-scrollbar {
            width: 8px;
        }

        .pane-body::-webkit-scrollbar-track {
            background: var(--cypher-bg-darkest);
        }

        .pane-body::-webkit-scrollbar-thumb {
            background: var(--cypher-primary-subtle);
            border-radius: 4px;
        }

        .pane-body::-webkit-scrollbar-thumb:hover {
            background: var(--cypher-primary);
        }

        /* File list focus state */
        .file-list:focus {
            outline: none;
        }

        .file-list:focus .file-item.selected {
            background: none;
        }

        .file-list:focus .file-item.selected::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(var(--cypher-primary) 0% 25%, transparent 0% 50%);
            background-size: 2px 2px;
            opacity: 1;
        }

        .file-list:focus .file-item.selected .file-item-icon {
            position: relative;
            color: var(--bg-color);
        }
    </style>

            if (win) {
                win.remove();

        function toggleFullscreen(id) {
            const win = openWindows[id];
            if (!win) return;

            if (win.classList.contains('fullscreen')) {
                // Restore previous position/size
                win.classList.remove('fullscreen');
                if (win._savedState) {
                    win.style.left = win._savedState.left;
                    win.style.top = win._savedState.top;
                    win.style.width = win._savedState.width;
                    win.style.height = win._savedState.height;
                }
            } else {
                // Save current position/size and go fullscreen
                win._savedState = {
                    left: win.style.left,
                    top: win.style.top,
                    width: win.style.width,
                    height: win.style.height
                };
                win.classList.add('fullscreen');
            }
            focusWindow(id);

                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
                <path d="M3 12a9 3 0 0 0 18 0"/>
            </svg>`
        };

        function populateFileList() {
            const list = document.getElementById('fileList');
            if (!list) return;

            list.innerHTML = intelFiles.map((file, i) => {
                const icon = fileIcons[file.type] || fileIcons.document;
                return `
                    <div class="file-item ${i === selectedFileIndex ? 'selected' : ''}" data-index="${i}" onclick="selectFile(${i})">
                        <div class="file-item-icon">${icon}</div>
                        <div class="file-item-info">
                            <div class="file-item-name">${file.name}</div>
                            <div class="file-item-meta">${file.type} • ${file.size}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add keyboard navigation
            list.addEventListener('keydown', handleFileListKeyboard);
            list.focus();

            // Show initial preview
            updateFilePreview();
        }

        function selectFile(index) {
            selectedFileIndex = index;
            document.querySelectorAll('.file-item').forEach((item, i) => {
                item.classList.toggle('selected', i === index);
            });
            updateFilePreview();
        }

        function updateFilePreview() {
            const preview = document.getElementById('previewPane');
            if (!preview) return;

            const file = intelFiles[selectedFileIndex];
            preview.innerHTML = `
                <div class="preview-content">
                    <div class="preview-header">
                        <div class="preview-title">${file.title}</div>
                        <div class="preview-meta">
                            <span class="preview-classification ${file.classification}">${file.classification}</span>
                            <span>${file.date}</span>
                            <span>${file.size}</span>
                        </div>
                    </div>
                    <div class="preview-body">
                        ${file.content}
                    </div>
                    <div class="preview-tags">
                        ${file.tags.map(t => `<span class="preview-tag">${t}</span>`).join('')}
                    </div>
                    <div class="preview-actions">
                        <button class="preview-btn primary">Download</button>
                        <button class="preview-btn">Export</button>
                    </div>
                </div>
            `;
        }

        function handleFileListKeyboard(e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectFile(Math.min(selectedFileIndex + 1, intelFiles.length - 1));
                document.querySelector('.file-item.selected')?.scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectFile(Math.max(selectedFileIndex - 1, 0));
                document.querySelector('.file-item.selected')?.scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter') {
                // Could trigger download or open action
                console.log('Open file:', intelFiles[selectedFileIndex].name);
            }
        }

        function handleTerminal(e) {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (!val) return;

                const parent = e.target.parentElement;
                const box = parent.parentElement;

                // Log command
                const log = document.createElement('div');
                log.className = 'terminal-line';
                log.innerText = `> ${val}`;
                box.insertBefore(log, parent);

                // Process command
                const res = document.createElement('div');
                res.className = 'terminal-line output';

                const cmd = val.toLowerCase().split(' ')[0];
                switch(cmd) {
                    case 'help':
                        res.innerText = 'Available commands: ls, cd, cat, download, pwd, help, clear';
                        break;
                    case 'ls':
                        res.innerHTML = 'intel/  personnel/  operations/  README.md';
                        res.className = 'terminal-line highlight';
                        break;
                    case 'pwd':
                        res.innerText = '/cypher/data';
                        break;
                    case 'clear':
                        [...box.querySelectorAll('.terminal-line')].forEach(n => n.remove());
                        e.target.value = '';
                        return;
                    default:
                        res.className = 'terminal-line dim';
                        res.innerText = `Unknown command: ${val}`;
                }

                box.insertBefore(res, parent);
                e.target.value = '';
                box.scrollTop = box.scrollHeight;
            }
        }

        /* --- Window Interaction --- */
        let activeAction = null;

        function startDrag(e, id) {
            if (e.target.closest('.close-btn')) return;
            focusWindow(id);
            activeAction = {
                type: 'drag',
                id,
                startX: e.clientX,
                startY: e.clientY,
                initialX: openWindows[id].offsetLeft,
                initialY: openWindows[id].offsetTop
            };
            window.addEventListener('mousemove', handleAction);
            window.addEventListener('mouseup', stopAction);
        }

        function startResize(e, id) {
            e.stopPropagation();
            focusWindow(id);
            activeAction = {
                type: 'resize',
                id,
                startX: e.clientX,
                startY: e.clientY,
                initialW: openWindows[id].offsetWidth,
                initialH: openWindows[id].offsetHeight
            };
            window.addEventListener('mousemove', handleAction);
            window.addEventListener('mouseup', stopAction);
        }

        function handleAction(e) {
            if (!activeAction) return;
            const win = openWindows[activeAction.id];
            if (activeAction.type === 'drag') {
                win.style.left = (activeAction.initialX + (e.clientX - activeAction.startX)) + 'px';
                win.style.top = (activeAction.initialY + (e.clientY - activeAction.startY)) + 'px';
            } else if (activeAction.type === 'resize') {
                win.style.width = Math.max(280, activeAction.initialW + (e.clientX - activeAction.startX)) + 'px';
                win.style.height = Math.max(180, activeAction.initialH + (e.clientY - activeAction.startY)) + 'px';
            }
        }

        function stopAction() {
            activeAction = null;
            window.removeEventListener('mousemove', handleAction);
            window.removeEventListener('mouseup', stopAction);
        }
    </script>
</body>
</html>
