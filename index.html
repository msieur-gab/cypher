<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYPHER</title>
  <style>
    body {
      font-family: monospace;
      background: #0a0a0a;
      color: #00FFCC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 255, 204, 0.2);
      border-top-color: #00FFCC;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div>Detecting device...</div>
  </div>

  <script>
    (function() {
      // Check for session parameter (scanned QR code)
      const params = new URLSearchParams(window.location.search);
      const session = params.get('session');

      if (session) {
        // Has session = scanned QR, go to agent
        window.location.replace('./agent/?session=' + encodeURIComponent(session));
        return;
      }

      // Device detection
      function isMobile() {
        // Check touch capability
        const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // Check screen size (mobile typically < 768px width)
        const isSmallScreen = window.innerWidth <= 768;

        // Check user agent for mobile indicators
        const mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Consider it mobile if user agent says so, OR if it has touch AND small screen
        return mobileUA || (hasTouch && isSmallScreen);
      }

      // Redirect based on device type
      if (isMobile()) {
        window.location.replace('./agent/');
      } else {
        window.location.replace('./terminal/');
      }
    })();
  </script>
</body>
</html>
