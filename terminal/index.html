<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYPHER Terminal</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; background: #0a0a0a; color: #00FFCC; padding: 2rem; text-align: center; margin: 0; min-height: 100vh; }
    h1 { color: #00FFCC; letter-spacing: 0.2em; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Connection screen */
    #qr { background: #000; display: inline-block; padding: 1rem; margin: 1rem; border-radius: 8px; border: 2px solid rgba(0, 255, 204, 0.3); }
    #status { padding: 1rem; margin: 1rem; border: 1px solid rgba(0, 255, 204, 0.3); }
    .connected { color: #00FFCC; }
    .waiting { color: #ffaa00; }
        #agent-url { font-size: 0.8rem; color: rgba(0, 255, 204, 0.5); word-break: break-all; max-width: 400px; margin: 0.5rem auto; }

    /* Boot screen - full terminal */
    #boot-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      padding: 2rem;
      text-align: left;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 100;
      scroll-behavior: smooth;
    }
    #boot-screen::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 101;
    }
    #boot-screen::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 102;
    }
    #boot-terminal {
      position: relative;
      z-index: 103;
      font-size: 0.95rem;
      line-height: 1.8;
      max-width: 800px;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
    }
    .boot-line {
      min-height: 1.8em;
      white-space: pre-wrap;
    }
    .boot-line.success { color: #00FFCC; }
    .boot-line.warning { color: #ffaa00; }
    .boot-line.error { color: #ff4444; }
    .boot-line.info { color: #555; }
    .boot-line.highlight {
      color: #00FFCC;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
      font-size: 1.1rem;
    }
    .boot-line.big {
      font-size: 1.3rem;
      margin: 0.5rem 0;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background: #00FFCC;
      animation: cursorBlink 0.7s infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }
    @keyframes cursorBlink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .progress-bar {
      display: inline-block;
      width: 300px;
      height: 14px;
      background: #111;
      border: 1px solid #333;
      margin-left: 10px;
      vertical-align: middle;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00FFCC, #00CCAA);
      width: 0%;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }
    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #00FFCC;
      margin: 1rem 0;
      display: block;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      animation: avatarPulse 0.8s ease-out;
    }
    @keyframes avatarPulse {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .glitch {
      animation: glitch 0.3s ease;
    }
    @keyframes glitch {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-2px); }
      40% { transform: translateX(2px); }
      60% { transform: translateX(-1px); }
      80% { transform: translateX(1px); }
    }

    /* Main screen */
    #agent-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem;
      margin: 1rem auto;
      border: 2px solid rgba(0, 255, 204, 0.3);
      border-radius: 8px;
      max-width: 400px;
      background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
      animation: profileIn 0.5s ease;
    }
    @keyframes profileIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    #agent-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #00FFCC;
      object-fit: cover;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }
    #agent-info { text-align: left; }
    #agent-codename {
      font-size: 1.5rem;
      color: #00FFCC;
      font-weight: bold;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    .level-badge {
      display: inline-block;
      background: #00FFCC;
      color: #000;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-weight: bold;
    }
    #connection-status {
      color: #00FFCC;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    #messages {
      text-align: left;
      max-width: 400px;
      margin: 1rem auto;
      padding: 1rem;
      border: 1px solid rgba(0, 255, 204, 0.3);
      min-height: 100px;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.5);
    }

    /* Locked screen */
    #locked-screen { position: relative; }
    #locked-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem;
      margin: 1rem auto;
      border: 2px solid rgba(255, 0, 0, 0.3);
      border-radius: 8px;
      max-width: 400px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
      opacity: 0.6;
    }
    #locked-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ff4444;
      object-fit: cover;
      background: #000;
      filter: grayscale(100%);
    }
    #locked-info { text-align: left; }
    #locked-codename {
      font-size: 1.5rem;
      color: #ff4444;
      font-weight: bold;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    .level-badge.locked { background: #ff4444; }
    #lock-status {
      color: #ff4444;
      font-size: 1.5rem;
      font-weight: bold;
      margin: 2rem 0;
      letter-spacing: 0.3em;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #lock-icon { font-size: 4rem; margin: 1rem 0; }
    button.unlock {
      background: transparent;
      color: #00FFCC;
      border: 2px solid #00FFCC;
      padding: 1rem 2rem;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 50px;
      margin-top: 1rem;
      transition: all 0.2s;
    }
    button.unlock:hover { background: rgba(0, 255, 204, 0.1); }
  </style>
</head>
<body>

  <!-- Connection Screen -->
  <div id="connect-screen" class="screen active">
    <h1>CYPHER Terminal</h1>
    <p>Scan QR with phone to connect</p>

    <div id="qr"></div>
    <div id="agent-url"></div>
    <div id="session">Session: <span id="sessionId">...</span></div>
    <div id="status" class="waiting">Waiting for agent...</div>
  </div>

  <!-- Boot Screen -->
  <div id="boot-screen" class="screen">
    <h1>CYPHER Terminal</h1>
    <div id="boot-terminal"></div>
  </div>

  <!-- Main Screen -->
  <div id="main-screen" class="screen">
    <h1>CYPHER Terminal</h1>

    <div id="agent-profile">
      <img id="agent-avatar" src="" alt="Agent Avatar">
      <div id="agent-info">
        <div id="agent-codename">AGENT</div>
        <div class="level-badge">Level <span id="agent-level">1</span></div>
        <div id="connection-status">Connected</div>
      </div>
    </div>

    <div id="messages"><strong>Messages:</strong><br></div>
  </div>

  <!-- Locked Screen -->
  <div id="locked-screen" class="screen">
    <h1>CYPHER Terminal</h1>

    <div id="lock-icon">🔒</div>
    <div id="lock-status">TERMINAL LOCKED</div>

    <div id="locked-profile">
      <img id="locked-avatar" src="" alt="Agent Avatar">
      <div id="locked-info">
        <div id="locked-codename">AGENT</div>
        <div class="level-badge locked">Level <span id="locked-level">1</span></div>
      </div>
    </div>

    <p style="color: #666; font-size: 0.85rem;">Agent connection lost</p>
    <button class="unlock" id="unlockBtn">UNLOCK TERMINAL</button>
  </div>

  <script type="module">
    import { Peer } from 'https://esm.sh/peerjs@1';
    import QRCode from 'https://esm.sh/qrcode@1';

    const connectScreen = document.getElementById('connect-screen');
    const bootScreen = document.getElementById('boot-screen');
    const mainScreen = document.getElementById('main-screen');
    const lockedScreen = document.getElementById('locked-screen');
    const bootTerminal = document.getElementById('boot-terminal');

    let lastProfile = null;

    // Generate session ID
    const sessionId = Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById('sessionId').textContent = sessionId;

    // Auto-detect host and generate QR
    const qrContainer = document.getElementById('qr');
    const agentUrlDisplay = document.getElementById('agent-url');

    // Get base path (works on GitHub Pages and localhost)
    const basePath = window.location.pathname.replace(/\/terminal\/?.*$/, '');
    const agentUrl = `${window.location.origin}${basePath}/agent/?session=${sessionId}`;

    agentUrlDisplay.textContent = agentUrl;

    QRCode.toCanvas(document.createElement('canvas'), agentUrl, {
      width: 200,
      color: { dark: '#00FFCC', light: '#000000' }
    }).then(canvas => qrContainer.appendChild(canvas));

    // Typing effect
    async function typeText(element, text, speed = 30) {
      const textNode = document.createTextNode('');
      element.insertBefore(textNode, element.firstChild);

      for (let i = 0; i < text.length; i++) {
        textNode.textContent += text[i];
        bootScreen.scrollTop = bootScreen.scrollHeight;
        if (text[i] !== ' ') {
          await new Promise(r => setTimeout(r, speed + Math.random() * 20));
        }
      }
    }

    // Boot sequence animation
    let isBooting = false;

    async function runBootSequence(profile) {
      if (isBooting) return;
      isBooting = true;

      connectScreen.classList.remove('active');
      lockedScreen.classList.remove('active');
      mainScreen.classList.remove('active');
      bootScreen.classList.add('active');
      bootTerminal.innerHTML = '';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      async function addLine(text, className = '', typed = false, delay = 300) {
        const div = document.createElement('div');
        div.className = `boot-line ${className}`;
        bootTerminal.appendChild(div);

        if (typed && text) {
          div.appendChild(cursor);
          await typeText(div, text, 25);
          if (cursor.parentNode === div) {
            div.removeChild(cursor);
          }
        } else {
          div.textContent = text;
        }

        bootScreen.scrollTop = bootScreen.scrollHeight;
        await new Promise(r => setTimeout(r, delay));
      }

      async function addProgress(label, duration = 2000) {
        const div = document.createElement('div');
        div.className = 'boot-line';

        const progressBar = document.createElement('div');
        progressBar.className = 'progress-bar';
        const progressFill = document.createElement('div');
        progressFill.className = 'progress-fill';
        progressBar.appendChild(progressFill);

        const percentSpan = document.createElement('span');
        percentSpan.textContent = ' 0%';

        div.appendChild(document.createTextNode(label + ' '));
        div.appendChild(progressBar);
        div.appendChild(percentSpan);
        bootTerminal.appendChild(div);
        bootScreen.scrollTop = bootScreen.scrollHeight;

        const steps = 50;
        const stepTime = duration / steps;

        for (let i = 0; i <= steps; i++) {
          const percent = Math.round((i / steps) * 100);
          progressFill.style.width = percent + '%';
          percentSpan.textContent = ' ' + percent + '%';
          await new Promise(r => setTimeout(r, stepTime));
        }

        await new Promise(r => setTimeout(r, 200));
      }

      // Start boot sequence
      await new Promise(r => setTimeout(r, 500));

      await addLine('CYPHER TERMINAL v2.1.0', 'info', false, 200);
      await addLine('Copyright (c) 2025 EU Digital Sovereignty Unit', 'info', false, 400);
      await addLine('', '', false, 300);

      await addLine('> Initializing secure connection...', '', true, 600);
      await addLine('', '', false, 200);

      await addLine('[SYS] Scanning for agent device...', 'info', false, 800);
      await addLine('[SYS] Device found: MOBILE_AGENT_' + Math.random().toString(36).substring(2, 6).toUpperCase(), 'info', false, 400);
      await addLine('[OK]  P2P tunnel established', 'success', false, 600);
      await addLine('', '', false, 300);

      await addLine('> Decrypting security handshake...', '', true, 500);
      await addProgress('[SYS] Decrypting', 2500);
      await addLine('[OK]  Encryption verified (AES-256-GCM)', 'success', false, 500);
      await addLine('', '', false, 300);

      await addLine('> Verifying agent credentials...', '', true, 600);
      await addLine('', '', false, 200);
      await addLine('[SYS] Agent ID: ' + profile.codename, 'warning', false, 400);
      await addLine('[SYS] Loading biometric signature...', 'info', false, 800);
      await addLine('[SYS] Matching against secure database...', 'info', false, 600);
      await addLine('[OK]  Biometric match confirmed', 'success', false, 500);
      await addLine('', '', false, 300);

      await addLine('> Configuring access permissions...', '', true, 600);
      await addProgress('[SYS] Loading clearance data', 1800);
      await addLine(`[SYS] Clearance level: ${profile.level}`, 'warning', false, 400);
      await addLine('[OK]  Access permissions configured', 'success', false, 600);
      await addLine('', '', false, 400);

      await addLine('════════════════════════════════════════════════', 'info', false, 100);
      await addLine('', '', false, 200);
      await addLine('        ██████  ACCESS GRANTED  ██████', 'highlight big', false, 400);
      await addLine('', '', false, 200);
      await addLine(`           Welcome, Agent ${profile.codename}`, 'highlight', false, 400);
      await addLine('', '', false, 200);
      await addLine('════════════════════════════════════════════════', 'info', false, 100);
      await addLine('', '', false, 300);
      await addLine('[SYS] Launching terminal interface...', 'info', false, 800);

      await new Promise(r => setTimeout(r, 1500));
      isBooting = false;
      showAgentProfile(profile);
    }

    function showAgentProfile(profile) {
      lastProfile = profile;

      connectScreen.classList.remove('active');
      lockedScreen.classList.remove('active');
      bootScreen.classList.remove('active');
      mainScreen.classList.add('active');

      if (profile.avatar) {
        document.getElementById('agent-avatar').src = profile.avatar;
      }
      document.getElementById('agent-codename').textContent = profile.codename;
      document.getElementById('agent-level').textContent = profile.level;
      document.getElementById('connection-status').textContent = 'Connected';
      document.getElementById('connection-status').style.color = '#00FFCC';
    }

    function showLockedScreen() {
      mainScreen.classList.remove('active');
      connectScreen.classList.remove('active');
      bootScreen.classList.remove('active');
      lockedScreen.classList.add('active');

      if (lastProfile) {
        if (lastProfile.avatar) {
          document.getElementById('locked-avatar').src = lastProfile.avatar;
        }
        document.getElementById('locked-codename').textContent = lastProfile.codename;
        document.getElementById('locked-level').textContent = lastProfile.level;
      }
    }

    function showConnectScreen() {
      mainScreen.classList.remove('active');
      lockedScreen.classList.remove('active');
      bootScreen.classList.remove('active');
      connectScreen.classList.add('active');
      document.getElementById('status').textContent = 'Waiting for agent...';
      document.getElementById('status').className = 'waiting';
    }

    document.getElementById('unlockBtn').addEventListener('click', showConnectScreen);

    // Create peer
    const peer = new Peer(`cypher-${sessionId}`, { debug: 2 });

    peer.on('open', id => {
      console.log('Terminal ready, peer ID:', id);
    });

    peer.on('connection', conn => {
      document.getElementById('status').textContent = 'Agent connecting...';

      let heartbeatInterval = null;
      let lastPong = Date.now();
      const HEARTBEAT_INTERVAL = 3000;
      const HEARTBEAT_TIMEOUT = 10000;

      function startHeartbeat() {
        heartbeatInterval = setInterval(() => {
          if (Date.now() - lastPong > HEARTBEAT_TIMEOUT) {
            console.log('Heartbeat timeout - agent disconnected');
            clearInterval(heartbeatInterval);
            conn.close();
            showLockedScreen();
          } else if (conn.open) {
            conn.send({ type: 'HEARTBEAT' });
          }
        }, HEARTBEAT_INTERVAL);
      }

      function stopHeartbeat() {
        if (heartbeatInterval) {
          clearInterval(heartbeatInterval);
          heartbeatInterval = null;
        }
      }

      conn.on('open', () => {
        document.getElementById('status').textContent = 'Agent connected!';
        document.getElementById('status').className = 'connected';
        lastPong = Date.now();
        startHeartbeat();

        conn.send({ type: 'WELCOME', message: 'Connected to CYPHER Terminal' });
      });

      conn.on('data', data => {
        console.log('Received:', data);
        lastPong = Date.now();

        if (data.type === 'INIT_STATE' && data.profile) {
          runBootSequence(data.profile);
        }

        const messagesEl = document.getElementById('messages');
        if (data.type === 'COMMAND') {
          messagesEl.innerHTML += `<span style="color:#00FFCC">[AGENT]</span> ${data.text}<br>`;
        } else if (data.type === 'PING') {
          messagesEl.innerHTML += `<span style="color:#666">[PING]</span> ${new Date(data.time).toLocaleTimeString()}<br>`;
        } else if (data.type !== 'INIT_STATE' && data.type !== 'PONG') {
          messagesEl.innerHTML += `← ${JSON.stringify(data)}<br>`;
        }
      });

      conn.on('close', () => {
        stopHeartbeat();
        showLockedScreen();
      });

      conn.on('error', () => {
        stopHeartbeat();
        showLockedScreen();
      });
    });

    peer.on('error', err => {
      console.error('Peer error:', err);
      document.getElementById('status').textContent = 'Error: ' + err.type;
    });
  </script>
</body>
</html>
